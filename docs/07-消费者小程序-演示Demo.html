<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>认养农业 SaaS · 消费者小程序 演示原型 v2</title>
<style>
  :root{
    --g:#22a06b; --gd:#17885a; --gl:#eaf7f0;
    --o:#ff8f1f; --ol:#fff5e8;
    --r:#e5484d;
    --bg:#f4f5f7; --card:#fff; --line:#eef0f3;
    --tx:#1a1f26; --tx2:#8b9199; --tx3:#b3b8bf;
    --sh:0 1px 3px rgba(20,30,50,.06);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#e8ecf1;color:var(--tx);min-height:100vh;}
  ::-webkit-scrollbar{width:0;height:0;}

  .app{display:flex;gap:26px;justify-content:center;align-items:flex-start;padding:24px 20px;flex-wrap:wrap;}

  /* ---------- 演示导航面板 ---------- */
  .guide{width:250px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(20,30,50,.12);padding:16px 14px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto;}
  .guide h1{font-size:15px;display:flex;align-items:center;gap:7px;}
  .guide h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--gl);}
  .guide .sub{font-size:11.5px;color:var(--tx2);margin:6px 0 12px;line-height:1.6;}
  .ggrp{margin-bottom:12px;}
  .ggrp .gt{font-size:10.5px;color:var(--tx3);letter-spacing:.6px;margin:0 0 6px 4px;font-weight:700;}
  .ggrp .gb{display:flex;flex-wrap:wrap;gap:5px;}
  .gbtn{font-size:11.5px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fbfcfd;color:#445;transition:.15s;}
  .gbtn:hover{background:var(--gl);border-color:var(--g);color:var(--gd);}
  .gbtn.flow{border-color:#ffd9ab;background:var(--ol);color:#a8620d;}
  .gbtn.flow:hover{background:#ffeacc;border-color:var(--o);}
  .gstep{font-size:11.5px;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px dashed #dfe6ee;background:#fafcff;margin-bottom:5px;}
  .gstep:hover{border-color:var(--g);background:var(--gl);}
  .gstep .n{width:16px;height:16px;border-radius:50%;background:var(--g);color:#fff;font-size:10px;display:flex;align-items:center;justify-content:center;flex:0 0 16px;}
  .tipbar{width:100%;max-width:1320px;margin:0 auto 8px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
  .tipbar span{background:rgba(255,255,255,.75);border:1px solid #d8e0e8;border-radius:20px;padding:5px 12px;font-size:11.5px;color:#4a5560;}

  /* ---------- 手机外壳 ---------- */
  .phonecase{width:377px;height:820px;background:#111;border-radius:48px;padding:11px;box-shadow:0 24px 70px rgba(10,25,45,.35);flex:0 0 auto;}
  .phone{width:100%;height:100%;background:var(--bg);border-radius:38px;overflow:hidden;position:relative;display:flex;flex-direction:column;}
  .statusbar{height:40px;flex:0 0 40px;background:#fff;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 3px;font-size:12.5px;font-weight:700;position:relative;z-index:5;}
  .statusbar .sb-r{display:flex;gap:5px;align-items:center;font-size:11px;}
  .statusbar .batter{width:22px;height:11px;border:1px solid #333;border-radius:3px;position:relative;}
  .statusbar .batter::after{content:"";position:absolute;right:-3px;top:3px;width:2px;height:5px;background:#333;border-radius:0 2px 2px 0;}
  .statusbar .batter i{display:block;height:9px;width:15px;background:#333;margin:.5px;border-radius:1px;}

  .navbar{height:44px;flex:0 0 44px;background:#fff;display:flex;align-items:center;padding:0 12px;position:relative;border-bottom:1px solid var(--line);z-index:4;}
  .navbar .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#222;}
  .navbar .title{position:absolute;left:0;right:0;text-align:center;font-size:15.5px;font-weight:600;pointer-events:none;}
  .navbar .rt{position:absolute;right:12px;font-size:12px;color:var(--tx2);display:flex;gap:12px;align-items:center;}
  .navbar .rt .on{color:var(--g);}

  .scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;position:relative;}
  .tabbar{height:54px;flex:0 0 54px;background:#fff;border-top:1px solid var(--line);display:flex;z-index:5;}
  .tabbar .tb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--tx3);font-size:10.5px;}
  .tabbar .tb.active{color:var(--g);font-weight:600;}

  .toast{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%) scale(.9);background:rgba(20,25,30,.86);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:99;max-width:80%;text-align:center;}
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;opacity:0;pointer-events:none;transition:.25s;}
  .mask.show{opacity:1;pointer-events:auto;}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;z-index:61;transform:translateY(105%);transition:.28s cubic-bezier(.3,.9,.3,1);padding:6px 0 20px;max-height:74%;overflow:auto;}
  .sheet.show{transform:translateY(0);}
  .sheet .sh-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14.5px;font-weight:600;}
  .sheet .sh-bd{padding:0 16px;}
  .fab{position:absolute;right:14px;bottom:74px;width:46px;height:46px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(34,160,107,.42);z-index:20;cursor:pointer;}

  /* ---------- 通用组件 ---------- */
  .card{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin:10px 12px;padding:14px;}
  .card.tight{margin:8px 12px;padding:12px;}
  .sec{padding:0 12px;}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:14px 12px 8px;}
  .hd h3{font-size:15.5px;display:flex;align-items:center;gap:6px;}
  .hd h3::before{content:"";width:3px;height:14px;background:var(--g);border-radius:2px;}
  .hd .more{font-size:12px;color:var(--tx2);display:flex;align-items:center;gap:2px;}
  .row{display:flex;align-items:center;gap:10px;}
  .bw{justify-content:space-between;}
  .mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}
  .t12{font-size:12px;color:var(--tx2);line-height:1.7;}
  .t13{font-size:13px;color:#4b5259;line-height:1.75;}
  .t14{font-size:14px;}
  .t15{font-size:15px;font-weight:600;}
  .t16{font-size:16px;font-weight:600;}
  .price{color:var(--r);font-weight:700;}
  .price b{font-size:20px;}
  .ofh{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .strk{text-decoration:line-through;color:var(--tx3);font-size:12px;font-weight:400;}
  .list-item{display:flex;align-items:center;gap:10px;padding:13px 14px;background:#fff;border-bottom:1px solid var(--line);}
  .list-item:active{background:#fafbfc;}
  .grid{display:grid;gap:10px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
  .g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
  .gcol{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#4b5259;cursor:pointer;}
  .gcol i{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:21px;font-style:normal;}
  .chip{font-size:11.5px;padding:4px 9px;border-radius:20px;background:var(--gl);color:var(--gd);display:inline-flex;align-items:center;gap:3px;}
  .chip.o{background:var(--ol);color:#a8620d;}
  .chip.gy{background:#f2f4f6;color:#6b7178;}
  .chip.r{background:#fdecec;color:var(--r);}
  .chip.b{background:#eaf2ff;color:#2b6cb8;}
  .btn{border:none;border-radius:24px;padding:11px 20px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit;}
  .btn.pri{background:linear-gradient(90deg,var(--g),var(--gd));color:#fff;flex:1;}
  .btn.sec{background:#fff;border:1px solid var(--g);color:var(--gd);flex:1;}
  .btn.gy{background:#f2f4f6;color:#6b7178;border:none;flex:1;}
  .btn.full{width:100%;}
  .btn.dis{background:#e3e7ea;color:#a3a9b0;}
  .footbar{position:sticky;bottom:0;left:0;right:0;background:#fff;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);z-index:12;}
  .prog{height:6px;background:#eef1f4;border-radius:6px;overflow:hidden;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#4bd07f,var(--g));border-radius:6px;}
  .ph{position:relative;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:rgba(255,255,255,.95);text-shadow:0 1px 3px rgba(0,0,0,.22);}
  .ph span{font-size:30px;}
  .ph b{font-size:11.5px;font-weight:600;letter-spacing:.5px;}
  .g1{background:linear-gradient(135deg,#63c98a,#2f9e63);}
  .g2{background:linear-gradient(135deg,#7fc4f5,#3f8fd6);}
  .g3{background:linear-gradient(135deg,#f0c07a,#c98a3c);}
  .g4{background:linear-gradient(135deg,#f9a6bd,#e2688c);}
  .g5{background:linear-gradient(135deg,#2c4a3a,#173023);}
  .g6{background:linear-gradient(135deg,#ffd07a,#ff9823);}
  .g7{background:linear-gradient(135deg,#c9b6a0,#8a7358);}
  .g8{background:linear-gradient(135deg,#a8d8a8,#5aa85a);}
  .pimg{border-radius:12px;flex:0 0 auto;}
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:0 0 auto;background:linear-gradient(135deg,#63c98a,#2f9e63);}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10;}
  .tabs .tab{flex:1;text-align:center;padding:11px 0;font-size:13.5px;color:var(--tx2);position:relative;cursor:pointer;}
  .tabs .tab.on{color:var(--g);font-weight:600;}
  .tabs .tab.on::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:26px;height:2.5px;background:var(--g);border-radius:2px;}
  .inp{width:100%;border:none;outline:none;font-size:14px;font-family:inherit;background:transparent;text-align:right;color:var(--tx);}
  .inp::placeholder{color:var(--tx3);}
  .timeline{position:relative;padding-left:22px;}
  .timeline::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:linear-gradient(180deg,#cdeadb,#e8edf1);}
  .tl-i{position:relative;margin-bottom:16px;cursor:pointer;}
  .tl-i::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:#fff;border:2.5px solid var(--g);}
  .tl-i.new::before{border-color:var(--o);background:var(--o);}
  .dot9{width:8px;height:8px;border-radius:50%;background:var(--r);flex:0 0 8px;}
  .kv{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;}
  .kv .k{color:var(--tx2);}
  .split{height:8px;background:var(--bg);}
  .noticebar{display:flex;align-items:center;gap:8px;background:var(--ol);color:#a8620d;font-size:11.5px;padding:8px 12px;}
  .searchbar{display:flex;align-items:center;gap:7px;background:#fff;border-radius:20px;padding:8px 12px;font-size:12.5px;color:var(--tx3);box-shadow:var(--sh);}
  .imgrow{display:flex;gap:6px;overflow-x:auto;padding:0 12px 12px;}
  .legend{margin:10px 12px;background:var(--gl);border:1px dashed #9ad7b6;border-radius:12px;padding:11px 13px;font-size:11.5px;color:#2f7358;line-height:1.75;}
  .legend b{display:block;font-size:12.5px;margin-bottom:3px;color:var(--gd);}
  .badge-live{position:absolute;left:8px;top:8px;background:rgba(229,72,77,.92);color:#fff;font-size:10px;padding:2px 7px;border-radius:20px;display:flex;align-items:center;gap:3px;}
  .badge-live::before{content:"";width:5px;height:5px;border-radius:50%;background:#fff;animation:blink 1.2s infinite;}
  @keyframes blink{50%{opacity:.25;}}
  .float-live{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:10.5px;padding:4px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;}
  .succ{display:flex;flex-direction:column;align-items:center;padding:26px 0 10px;}
  .succ .cir{width:62px;height:62px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;color:var(--g);margin-bottom:12px;}
  .ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
  .ell3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
  .lvbar{display:flex;align-items:center;gap:6px;background:linear-gradient(90deg,#3d5a4a,#20362b);color:#e9d9b6;font-size:10.5px;padding:3px 8px;border-radius:20px;}
  .notebox{background:#f7f9fb;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:12px;color:#5b646d;line-height:1.8;}
  .grid-line{border-top:1px solid var(--line);}
  .feedimg{height:170px;border-radius:10px;}
  .cover13{height:130px;}
  .w100{width:100%;}
  .ctr{text-align:center;}
  .pad16{padding:0 16px;}
</style>
</head>

/* ---------- 路由 ---------- */
function cur(){return stack[stack.length-1];}
function go(n,p){
  if(!PAGES[n]){toast('页面未完成：'+n);return;}
  stack.push({n:n,p:p});render();scrollTop();
}
function back(){ if(stack.length>1){stack.pop();render();} }
function tabTo(n){ stack=[{n:n}];render();scrollTop(); }
function scrollTop(){ $('#scroll').scrollTop=0; }

function render(){
  const c=cur(), pg=PAGES[c.n]||PAGES.home;
  $('#scroll').innerHTML=pg.render(c.p);
  const isRoot=ROOTS.indexOf(c.n)>=0;
  $('#tabbar').style.display=pg.noTab?'none':'flex';
  $('#navbar').style.display=pg.hideNav?'none':'flex';
  $('#phone').classList.toggle('full',!!pg.full);
  $('#navTitle').textContent=pg.title||'';
  $('#btnBack').innerHTML=(isRoot||pg.noBack)?'':I('back','',23);
  $('#navRt').innerHTML=pg.rt||'';
  renderTabs(isRoot?c.n:'');
  if(pg.onShow)pg.onShow();
}
function renderTabs(active){
  const items=[['home','home','首页'],['grid','mall','认养'],['book','diary','日记'],['user','mine','我的']];
  $('#tabbar').innerHTML=items.map(function(x){
    return '<div class="tb '+(active===x[2]?'active':'')+'" data-tab="'+x[2]+'">'+I(x[0],'',22)+'<span>'+x[2]+'</span></div>';
  }).join('');
}

/* ---------- 事件 ---------- */
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-go],[data-act],[data-tab]');
  if(!el)return;
  if(el.dataset.tab){tabTo(el.dataset.tab);return;}
  /* 先执行动作，再执行跳转：支持「重置流程并进入下单页」这类组合 */
  if(el.dataset.act){
    const v=el.dataset.act.split(':');
    if(ACT[v[0]])ACT[v[0]](v[1],el);
  }
  if(el.dataset.go){
    const v=el.dataset.go.split(':');
    go(v[0],v[1]||el.dataset.p);
  }
});

function pvcard(p){
  const rate=Math.round(p.sold/p.total*100);
  return '<div style="flex:0 0 168px;background:#fff;border-radius:13px;overflow:hidden;box-shadow:var(--sh);cursor:pointer" data-go="product:'+p.id+'">'+
    '<div class="ph '+p.cover+'" style="height:104px;position:relative"><span style="font-size:28px">'+p.emoji+'</span>'+
      (p.total<9999?'<div style="position:absolute;right:0;bottom:0;background:rgba(0,0,0,.42);color:#fff;font-size:10px;padding:2px 6px;border-radius:6px 0 0 0">剩 '+(p.total-p.sold)+' 份</div>':'')+
    '</div>'+
    '<div style="padding:8px 10px 10px">'+
      '<div class="t14 ofh">'+p.name+'</div>'+
      '<div class="t12 ofh" style="margin-top:3px">'+p.sub+'</div>'+
      '<div class="row bw" style="margin-top:7px"><span class="price" style="font-size:16px;font-weight:700">¥'+p.price+'</span><span class="t12">'+p.cycle+'</span></div>'+
      '<div class="prog" style="margin-top:7px"><i style="width:'+rate+'%"></i></div>'+
      '<div class="t12" style="margin-top:4px;font-size:10.5px">已认养 '+rate+'%</div>'+
    '</div></div>';
}
function feedCard(d){
  const pics=d.pics.map(function(g){return '<div class="ph '+g+'" style="flex:0 0 106px;height:106px"><span style="font-size:22px">'+d.e+'</span></div>';}).join('');
  return '<div class="card tight" style="cursor:pointer" data-go="diaryDetail:'+d.id+'">'+
    '<div class="row" style="gap:9px">'+
      '<div class="avatar" style="width:34px;height:34px;font-size:13px">'+d.avatar+'</div>'+
      '<div style="flex:1"><div class="t14">'+d.who+'</div><div class="t12" style="font-size:11px">'+d.t+' · '+D.farms.find(function(f){return f.id===d.farm;}).name+'</div></div>'+
      '<span class="chip gy">'+I('loc','',12)+'</span>'+
    '</div>'+
    '<div class="t13" style="margin:9px 0">'+d.txt+'</div>'+
    '<div class="row" style="gap:6px;overflow:hidden">'+pics+'</div>'+
    '<div class="row bw" style="margin-top:11px;padding-top:9px;border-top:1px solid var(--line)">'+
      '<div class="row" style="gap:16px">'+
        '<span class="t12" data-like="'+d.id+'" data-on="0" data-act="like:'+d.id+'" style="display:flex;align-items:center;gap:4px;cursor:pointer">'+I('heart','',15)+'<span>'+d.likes+'</span></span>'+
        '<span class="t12" style="display:flex;align-items:center;gap:4px">'+I('chat','',15)+d.cmts+'</span>'+
        '<span class="t12" style="display:flex;align-items:center;gap:4px">'+I('share','',15)+'分享</span>'+
      '</div>'+
      '<span class="t12" style="font-size:11px">'+I('more','',15)+'</span>'+
    '</div></div>';
}

function calcPrice(){
  const p=D.products.find(function(x){return x.id===S.pid;});
  const sp=p.specs[S.spec]||p.specs[0], cy=p.cycles[S.cycle]||p.cycles[0];
  const cm=curCare(p);
  const base=Math.max(0,sp.p+(cy.p||0)+(cm?cm.delta:0));
  const cp=S.coupon?D.coupons.find(function(c){return c.id===S.coupon;}):null;
  const cut=(cp&&base>=cp.min)?cp.v:0;
  const pt=S.usePoint?Math.min(S.pointCut,Math.floor(base/100)):0;
  return {p:p,sp:sp,cy:cy,cm:cm,base:base,cut:cut,pt:pt,total:base-cut-pt};
}
