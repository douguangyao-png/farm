function cur(){return stack[stack.length-1];}
function render(){
  const c=cur(),pg=PAGES[c.n]||PAGES.home;
  $('#scroll').innerHTML=pg.render(c.p);
  const root=ROOTS.indexOf(c.n)>=0;
  $('#navbar').style.display=pg.hideNav?'none':'flex';
  $('#tabbar').style.display=pg.noTab?'none':'flex';
  $('#navTitle').textContent=pg.title||'';
  $('#btnBack').innerHTML=(root||pg.noBack)?'':I('back','',23);
  $('#navRt').innerHTML=pg.rt||'';
  $('#tabbar').innerHTML=[['home','工作台'],['grid','标的'],['chat','消息'],['user','我的']].map(function(x){
    return '<div class="tb '+(root&&c.n===x[0]?'active':'')+'" data-tab="'+x[0]+'">'+I(x[0],'',22)+'<span>'+x[1]+'</span></div>';
  }).join('');
}
let tt;
function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('show');},1600);}
function sheet(title,html){ $('#sheet').innerHTML='<div style="padding:12px 16px;display:flex;align-items:center"><span style="font-size:14.5px;font-weight:600">'+title+'</span><span style="margin-left:auto;cursor:pointer;color:#999" data-act="closeSheet">'+I('back','',0)+'✕</span></div><div style="padding:0 16px">'+html+'</div>';
  $('#sheet').classList.add('show');$('#mask').classList.add('show'); }
function closeSheet(){$('#sheet').classList.remove('show');$('#mask').classList.remove('show');}
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-go],[data-act],[data-tab]');
  if(!el)return;
  if(el.dataset.tab){tabTo(el.dataset.tab);return;}
  if(el.dataset.act){const v=el.dataset.act.split(':');if(ACT[v[0]])ACT[v[0]](v[1],el);}
  if(el.dataset.go){const v=el.dataset.go.split(':');go(v[0],v[1]||el.dataset.p);}
});
$('#btnBack').addEventListener('click',back);
$('#mask').addEventListener('click',closeSheet);
const ACT={
  closeSheet:closeSheet,back:back,toast:function(m){toast(m);},notImp:function(){toast('演示原型：需连接后端');},
  toggle:function(k){S[k]=!S[k];render();},
  pickType:function(i){S.punchType=+i;render();},
  pickLand:function(k){S.punchLand=k;render();},
  punchDone:function(){closeSheet();toast('已提交，等待后台审核');setTimeout(function(){go('archiveList');},700);},
  taskDone:function(){toast('任务已标记完成 · 绩效 +1');},
  careDone:function(){toast('处理方案已回传给认养人');},
  scan:function(){toast('扫码核销成功 · 本单已出库');},
  alarmDone:function(){toast('异常已上报，责任人已通知');}
};
