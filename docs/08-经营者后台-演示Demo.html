<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>认养农业 SaaS · 经营者后台 演示原型 v2</title>
<style>
  :root{
    --g:#22a06b; --gd:#17885a; --gl:#eaf7f0;
    --o:#ff8f1f; --ol:#fff5e8; --r:#e5484d; --rl:#fdecec; --b:#2b6cb8; --bl:#eaf2ff;
    --bg:#f3f5f7; --card:#fff; --line:#e9edf1; --line2:#f2f5f8;
    --tx:#1a1f26; --tx2:#7b838c; --tx3:#aab1b8;
    --side:#1e2b26;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#e6eaef;color:var(--tx);font-size:13px;}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#cfd6dd;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .app{display:flex;gap:20px;align-items:flex-start;padding:18px 16px;}
  /* ===== 演示导航 ===== */
  .guide{width:236px;flex:0 0 236px;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(20,30,50,.12);padding:14px 12px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;}
  .guide h1{font-size:14px;display:flex;align-items:center;gap:7px;}
  .guide h1 .dot{width:8px;height:8px;border-radius:50%;background:var(--g);box-shadow:0 0 0 4px var(--gl);}
  .guide .sub{font-size:11px;color:var(--tx2);margin:6px 0 10px;line-height:1.65;}
  .ggrp{margin-bottom:10px;}
  .ggrp .gt{font-size:10px;color:var(--tx3);letter-spacing:.5px;margin:0 0 5px 4px;font-weight:700;}
  .ggrp .gb{display:flex;flex-wrap:wrap;gap:4px;}
  .gbtn{font-size:11px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;cursor:pointer;background:#fbfcfd;color:#4a525b;transition:.15s;}
  .gbtn:hover{background:var(--gl);border-color:var(--g);color:var(--gd);}
  .gstep{font-size:11px;display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;border:1px dashed #dfe6ee;background:#fafcff;margin-bottom:4px;}
  .gstep:hover{border-color:var(--g);background:var(--gl);}
  .gstep .n{width:15px;height:15px;border-radius:50%;background:var(--g);color:#fff;font-size:9.5px;display:flex;align-items:center;justify-content:center;flex:0 0 15px;}

  /* ===== 浏览器外壳 ===== */
  .browser{width:1180px;flex:0 0 1180px;height:822px;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(10,25,45,.28);display:flex;flex-direction:column;}
  .btop{height:38px;flex:0 0 38px;background:#e8ecef;border-bottom:1px solid #d8dee4;display:flex;align-items:center;padding:0 12px;gap:7px;}
  .btop .dot{width:11px;height:11px;border-radius:50%;}
  .btop .url{flex:1;margin:0 10px;background:#fff;border-radius:7px;height:23px;display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--tx2);gap:6px;}
  .layout{flex:1;display:flex;min-height:0;}

  /* ===== 侧栏 ===== */
  .side{width:172px;flex:0 0 172px;background:var(--side);color:#a9bdb3;display:flex;flex-direction:column;}
  .side .logo{height:52px;display:flex;align-items:center;gap:8px;padding:0 14px;color:#fff;font-size:13.5px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.07);}
  .side .logo .lg{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#4bd07f,var(--g));display:flex;align-items:center;justify-content:center;font-size:13px;}
  .side .scroll{flex:1;overflow:auto;padding:8px 0 20px;}
  .side .gp{font-size:10px;color:#5f7a6e;padding:12px 16px 5px;letter-spacing:.6px;}
  .side .mi{display:flex;align-items:center;gap:8px;padding:8px 16px;font-size:12.5px;cursor:pointer;border-left:2.5px solid transparent;}
  .side .mi:hover{color:#fff;background:rgba(255,255,255,.05);}
  .side .mi.on{color:#fff;background:rgba(34,160,107,.22);border-left-color:var(--g);font-weight:600;}
  .side .mi .cnt{margin-left:auto;background:var(--r);color:#fff;font-size:9.5px;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 4px;}
  .side .pack{margin:10px 12px;background:rgba(255,255,255,.07);border-radius:9px;padding:10px;font-size:10.5px;line-height:1.7;color:#b9cbc2;}
  .side .pack b{color:#fff;font-size:11.5px;}

  /* ===== 主区 ===== */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);}
  .topbar{height:48px;flex:0 0 48px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:10px;}
  .crumb{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tx2);}
  .crumb b{color:var(--tx);font-weight:600;font-size:13.5px;}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .chipmini{font-size:11px;padding:3px 8px;border-radius:6px;background:var(--gl);color:var(--gd);display:inline-flex;align-items:center;gap:4px;}
  .chipmini.o{background:var(--ol);color:#a8620d;}
  .chipmini.r{background:var(--rl);color:var(--r);}
  .chipmini.b{background:var(--bl);color:var(--b);}
  .chipmini.gy{background:#f1f4f6;color:#6b7178;}
  .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#63c98a,#2f9e63);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600;flex:0 0 auto;}
  .avatar.bk{background:linear-gradient(135deg,#8ec5f7,#4d8fd6);}

  .content{flex:1;overflow:auto;padding:14px 16px 24px;}
  .pagehd{display:flex;align-items:flex-start;margin-bottom:12px;}
  .pagehd h2{font-size:16px;font-weight:600;display:flex;align-items:center;gap:7px;}
  .pagehd .desc{font-size:11.5px;color:var(--tx2);margin-top:4px;line-height:1.6;}
  .pagehd .acts{margin-left:auto;display:flex;gap:8px;}

  .btn{border:none;border-radius:7px;padding:7px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:5px;}
  .btn.pri{background:var(--g);color:#fff;}
  .btn.pri:hover{background:var(--gd);}
  .btn.sec{background:#fff;border:1px solid var(--g);color:var(--gd);}
  .btn.gy{background:#fff;border:1px solid var(--line);color:#5b6169;}
  .btn.gy:hover{border-color:#c9d2da;}
  .btn.dan{background:#fff;border:1px solid var(--r);color:var(--r);}
  .btn.sm{padding:4px 9px;font-size:11.5px;border-radius:6px;}
  .btn.dis{background:#eef1f3;color:#aab1b8;}

  .gridK{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px;}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 13px;}
  .kpi .t{font-size:11.5px;color:var(--tx2);display:flex;align-items:center;gap:5px;}
  .kpi .v{font-size:22px;font-weight:700;margin-top:6px;letter-spacing:-.5px;}
  .kpi .s{font-size:11px;color:var(--tx2);margin-top:4px;display:flex;align-items:center;gap:5px;}
  .up{color:var(--r);} .down{color:var(--g);}
  .kpi .ic{width:28px;height:28px;border-radius:8px;background:var(--gl);display:flex;align-items:center;justify-content:center;margin-left:auto;}

  .cols{display:grid;gap:12px;}
  .c2{grid-template-columns:1fr 1fr;} .c32{grid-template-columns:2fr 1fr;} .c23{grid-template-columns:1fr 2fr;}
  .panel{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .panel .ph2{display:flex;align-items:center;padding:11px 13px;border-bottom:1px solid var(--line2);}
  .panel .ph2 h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .panel .ph2 .rt{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--tx2);}
  .panel .pb{padding:12px 13px;}

  table{width:100%;border-collapse:collapse;}
  th{text-align:left;font-size:11.5px;color:var(--tx2);font-weight:500;padding:9px 12px;background:#fafbfc;border-bottom:1px solid var(--line);white-space:nowrap;}
  td{padding:10px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:#fbfcfd;}
  td.op{color:var(--gd);}
  td .lk{cursor:pointer;user-select:none;}
  td .lk:hover{text-decoration:underline;}

  .tabs2{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;}
  .tabs2 .t{padding:8px 12px;font-size:12.5px;color:var(--tx2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;}
  .tabs2 .t.on{color:var(--gd);font-weight:600;border-bottom-color:var(--g);}
  .filters{background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-bottom:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;}
  .fitem{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:6px 9px;cursor:pointer;}
  .fitem input,.fitem select{border:none;background:transparent;outline:none;font-family:inherit;font-size:12px;color:var(--tx);}
  .fitem.w160{width:170px;}

  .formrow{display:flex;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line2);gap:14px;}
  .formrow .lab{width:96px;flex:0 0 96px;font-size:12.5px;color:var(--tx2);padding-top:5px;text-align:right;}
  .formrow .val{flex:1;}
  .input{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:inherit;outline:none;}
  .input:focus{border-color:var(--g);}
  .input.w240{width:240px;}
  .tags{display:flex;gap:6px;flex-wrap:wrap;}
  .tagPick{font-size:12px;padding:5px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;color:#5b6169;background:#fff;}
  .tagPick.on{border-color:var(--g);background:var(--gl);color:var(--gd);font-weight:600;}
  .note{background:var(--gl);border:1px dashed #9ad7b6;border-radius:8px;padding:9px 11px;font-size:11.5px;color:#2f7358;line-height:1.75;}
  .note.o{background:var(--ol);border-color:#f5cf9a;color:#93580a;}
  .note.r{background:var(--rl);border-color:#f3b7b9;color:#a1292d;}
  .note.gy{background:#f7f9fb;border-color:var(--line);color:#5b646d;}
  .hint{font-size:11px;color:var(--tx3);margin-top:5px;line-height:1.6;}

  .prog{height:6px;background:#eef1f4;border-radius:6px;overflow:hidden;min-width:60px;}
  .prog i{display:block;height:100%;background:linear-gradient(90deg,#4bd07f,var(--g));border-radius:6px;}
  .prog.o i{background:linear-gradient(90deg,#ffc46b,var(--o));}
  .prog.r i{background:linear-gradient(90deg,#ff9b9e,var(--r));}
  .ph{position:relative;border-radius:8px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.2);gap:2px;}
  .ph span{font-size:20px;} .ph b{font-size:10.5px;font-weight:600;}
  .g1{background:linear-gradient(135deg,#63c98a,#2f9e63);} .g2{background:linear-gradient(135deg,#7fc4f5,#3f8fd6);}
  .g3{background:linear-gradient(135deg,#f0c07a,#c98a3c);} .g4{background:linear-gradient(135deg,#f9a6bd,#e2688c);}
  .g5{background:linear-gradient(135deg,#2c4a3a,#173023);} .g6{background:linear-gradient(135deg,#ffd07a,#ff9823);}
  .g7{background:linear-gradient(135deg,#c9b6a0,#8a7358);} .g8{background:linear-gradient(135deg,#a8d8a8,#5aa85a);}
  .cells{display:grid;gap:7px;}
  .cell{border:1px solid var(--line);border-radius:9px;padding:9px 10px;background:#fff;cursor:pointer;}
  .cell:hover{border-color:var(--g);}
  .cell.hd,.cell.on{border-color:var(--g);background:var(--gl);}
  .cell.free{border-style:dashed;}
  .cell.rest{background:#f7f9fb;}
  .cell .n{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:5px;}
  .cell .s{font-size:10.5px;color:var(--tx2);margin-top:3px;line-height:1.5;}
  .flexrow{display:flex;align-items:center;gap:8px;}
  .mt8{margin-top:8px;}.mt10{margin-top:10px;}.mt12{margin-top:12px;}.mt14{margin-top:14px;}
  .tx2{color:var(--tx2);} .tx3{color:var(--tx3);}
  .b700{font-weight:700;} .nowrap{white-space:nowrap;}
  .split{height:1px;background:var(--line2);margin:10px 0;}
  .toast{position:fixed;left:50%;top:26px;transform:translate(-50%,-16px);background:rgba(25,32,28,.9);color:#fff;padding:9px 18px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:.22s;z-index:999;}
  .toast.show{opacity:1;transform:translate(-50%,0);}
  .mask{position:absolute;inset:0;background:rgba(0,0,0,.4);z-index:60;opacity:0;pointer-events:none;transition:.2s;}
  .mask.show{opacity:1;pointer-events:auto;}
  .drawer{position:absolute;right:0;top:0;bottom:0;width:460px;background:#fff;z-index:61;transform:translateX(102%);transition:.28s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column;}
  .drawer.show{transform:translateX(0);}
  .drawer .dh{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
  .drawer .dh h3{font-size:14px;}
  .drawer .db{flex:1;overflow:auto;padding:14px 16px;}
  .drawer .df{padding:11px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;}
  .kv{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--line2);}
  .kv .k{color:var(--tx2);}
  .timeline{position:relative;padding-left:18px;}
  .timeline::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:#e6ebef;}
  .tl{position:relative;padding-bottom:14px;}
  .tl::before{content:"";position:absolute;left:-17px;top:4px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--g);}
  .tl.dim::before{border-color:#cfd6dd;}
  .tl .h{display:flex;justify-content:space-between;font-size:12.5px;}
  .tl .s{font-size:11.5px;color:var(--tx2);margin-top:2px;line-height:1.6;}
  .legend{font-size:11px;color:var(--tx2);display:flex;gap:14px;flex-wrap:wrap;padding:8px 0 2px;}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;}
</style>
</head>

  return '<table><thead><tr>'+cols.map(function(c){return '<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+c.t+'</th>';}).join('')+'</tr></thead><tbody>'+rows+'</tbody></table>';
}
function badge(t,type){return '<span class="chipmini'+(type?' '+type:'')+'">'+t+'</span>';}
function lineChart(vals,color,labels,h){
  const w=560,hh=h||110,max=Math.max.apply(null,vals),min=Math.min.apply(null,vals);
  const pts=vals.map(function(v,i){return (i*(w/(vals.length-1))).toFixed(1)+','+(hh-10-(v-min)/((max-min)||1)*(hh-24)).toFixed(1);}).join(' ');
  return '<svg viewBox="0 0 '+w+' '+hh+'" style="width:100%;height:'+hh+'px">'+
    '<defs><linearGradient id="lgc'+color.replace('#','')+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="'+color+'" stop-opacity=".22"/><stop offset="100%" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'+
    '<polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
    '<polygon points="'+pts+' '+w+','+hh+' 0,'+hh+'" fill="url(#lgc'+color.replace('#','')+')"/>'+
    (labels?labels.map(function(l,i){return '<text x="'+(i*(w/(labels.length-1))).toFixed(1)+'" y="'+(hh-1)+'" font-size="10" fill="#aab1b8" text-anchor="middle">'+l+'</text>';}).join(''):'')+
    '</svg>';
}
function barList(items,max,unit){
  return items.map(function(x){

      '<div class="prog"><i style="width:'+Math.round(x[1]/max*100)+'%"></i></div></div>';

}

  }).join('')+(extra||'<span class="btn pri sm" style="margin-left:auto">查询</span><span class="btn gy sm">重置</span>')+'</div>';
}
